<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Choose the install identity before the application loads. Client and
      // admin shortcuts must not share the same homepage start URL.
      const adminShortcut = location.pathname.replace(/\/+$/, '') === '/admin'
        || location.hash === '#/admin-login'
      const manifest = document.createElement('link')
      manifest.rel = 'manifest'
      manifest.href = adminShortcut ? '/admin.webmanifest' : '/manifest.webmanifest'
      document.head.appendChild(manifest)
      const appTitle = document.createElement('meta')
      appTitle.name = 'apple-mobile-web-app-title'
      appTitle.content = adminShortcut ? 'NandiphaM Admin' : 'NandiphaM'
      document.head.appendChild(appTitle)
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b52c68" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="NandiphaM helps clients ship from China to Botswana with Guangzhou receiving, goods inspection, sea and air freight updates, receipts and secure client portal access." />
    <title>NandiphaM | China to Botswana Shipping Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
